name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_name: cf-picker-x86_64-unknown-linux-gnu
            exe: cf-picker
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive_name: cf-picker-aarch64-unknown-linux-gnu
            exe: cf-picker
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            archive_name: cf-picker-x86_64-pc-windows-gnu
            exe: cf-picker.exe
          - target: aarch64-pc-windows-gnullvm
            os: ubuntu-latest
            archive_name: cf-picker-aarch64-pc-windows-gnullvm
            exe: cf-picker.exe
          - target: x86_64-apple-darwin
            os: macos-latest
            archive_name: cf-picker-x86_64-apple-darwin
            exe: cf-picker
          - target: aarch64-apple-darwin
            os: macos-latest
            archive_name: cf-picker-aarch64-apple-darwin
            exe: cf-picker

    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild & zig (Linux)
        if: runner.os == 'Linux'
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked

      - name: Install cargo-zigbuild & zig (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install zig cargo-zigbuild

      - name: Build binary
        run: cargo zigbuild --release --target ${{ matrix.target }} -p cf-picker-cli

      - name: Package archive (Unix)
        if: matrix.exe == 'cf-picker'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/cf-picker-cli dist/${{ matrix.exe }}
          cp README.md LICENSE dist/ 2>/dev/null || true
          cd dist
          tar -czvf ../${{ matrix.archive_name }}.tar.gz *

      - name: Package archive (Windows)
        if: matrix.exe == 'cf-picker.exe'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/cf-picker-cli.exe dist/${{ matrix.exe }}
          cp README.md LICENSE dist/ 2>/dev/null || true
          cd dist
          tar -czvf ../${{ matrix.archive_name }}.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@main
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}.tar.gz

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Determine tag version
        id: tag_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.version }}"
          else
            TAG_NAME="${{ github.ref_name }}"
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@main
        with:
          path: ./artifacts

      - name: Prepare release files
        run: |
          mkdir -p ./release_files
          find ./artifacts -type f -name "*.tar.gz" -exec cp {} ./release_files/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.tag }}
          name: Release ${{ steps.tag_version.outputs.tag }}
          draft: false
          prerelease: false
          files: ./release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
